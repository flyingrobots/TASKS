name: Overview DAG

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-overview-dag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preflight checks
        run: |
          set -e
          test -f scripts/gh/overview-dag.sh || { echo "missing scripts/gh/overview-dag.sh" >&2; exit 1; }
      - name: Generate overview DAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          bash scripts/gh/overview-dag.sh docs/overview-dag.dot docs/overview-dag.svg
      - name: Generate planner DAGs (T.A.S.K.S.)
        run: |
          set -e
          bash scripts/gh/plan-dag.sh planner/plans docs
      - name: Publish CI preview branch (no commits on PR branch)
        if: github.event_name == 'pull_request'
        id: publish
        env:
          PREVIEW_BRANCH: ci-preview-${{ github.run_id }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --depth=1
          # Create an orphan branch that only contains preview assets for this run
          git checkout --orphan "$PREVIEW_BRANCH"
          git reset --hard
          git rm -rf . || true
          mkdir -p previews
          cp -f docs/overview-dag.svg previews/overview-dag.svg || true
          cp -f docs/overview-dag.dot previews/overview-dag.dot || true
          cp -f docs/plan-dag.svg previews/plan-dag.svg || true
          cp -f docs/runtime.svg previews/runtime.svg || true
          git add previews
          if git diff --cached --quiet; then
            echo "Nothing to publish for previews" >&2
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "ci: preview assets for run ${{ github.run_id }}"
          git push -f origin "$PREVIEW_BRANCH"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "branch=$PREVIEW_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Verify DAG outputs
        run: |
          test -f docs/overview-dag.dot || { echo "docs/overview-dag.dot missing" >&2; exit 1; }
          if test -f docs/overview-dag.svg; then
            if ! (head -c 5 docs/overview-dag.svg | grep -q '<?xml' || head -n1 docs/overview-dag.svg | grep -q '^<svg'); then
              echo 'WARN: overview-dag.svg has invalid header; continuing (inline preview may be omitted)' >&2
            fi
          else
            echo 'WARN: overview-dag.svg missing; continuing (artifact still uploaded)' >&2
          fi
      - name: Summarize DAG artifacts
        run: |
          set -e
          if command -v dot >/dev/null 2>&1; then echo "Graphviz: $(dot -V 2>&1 | head -n1 | sed 's/\r$//')"; else echo "Graphviz: dot not installed (using viz.js if available)"; fi
          echo "Sizes:"; ls -lh -- docs/overview-dag.dot docs/overview-dag.svg
          # Quick node/edge counts (best-effort)
          NODES=$(grep -Eo '^\s*[A-Za-z0-9_]+\s*\[' docs/overview-dag.dot | wc -l | tr -d ' ')
          EDGES=$(grep -Eo '->' docs/overview-dag.dot | wc -l | tr -d ' ')
          echo "Nodes: ${NODES}  Edges: ${EDGES}"
      - name: Commit DAG image to PR branch (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: commit_dag
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -e
          git fetch origin "refs/heads/${BRANCH}:refs/heads/${BRANCH}" --depth=1
          if ! git checkout "$BRANCH" 2>/dev/null; then
            echo "checkout failed; creating $BRANCH" >&2
            git checkout -B "$BRANCH"
          fi
          mkdir -p docs
          # restore generated files from previous step
          cp -f "$RUNNER_TEMP/overview-dag.svg" docs/overview-dag.svg || true
          cp -f "$RUNNER_TEMP/overview-dag.dot" docs/overview-dag.dot || true
          git add docs/overview-dag.svg docs/overview-dag.dot
          if ! git diff --cached --quiet; then
            git commit -m "docs: update overview DAG (CI)"
            git push origin "$BRANCH"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare PR comment content
        if: github.event_name == 'pull_request'
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TMPFILE: ${{ runner.temp }}/dag-comment.md
          PREVIEW_BRANCH: ${{ steps.publish.outputs.branch || format('ci-preview-{0}', github.run_id) }}
        run: |
          RAW_BASE="https://raw.githubusercontent.com/${REPO}/${PREVIEW_BRANCH}/previews"
          NODES=$(grep -Eo '^\s*[A-Za-z0-9_]+\s*\[' docs/overview-dag.dot | wc -l | tr -d ' ')
          EDGES=$(grep -Eo '->' docs/overview-dag.dot | wc -l | tr -d ' ')
          HFILE="docs/overview-dag.highlights.txt"
          if test -s "$HFILE"; then
            HIGHLIGHTS=$(tr '\n' ' ' < "$HFILE" | sed 's/ *$//')
            HL_MSG="PR references: #${HIGHLIGHTS// /, #}"
          else
            HL_MSG="PR is not associated with an issue yet"
          fi
          {
            echo "### Your GitHub Issues as a DAG"
            echo
            echo "Workflow run: ${RUN_URL}"
            echo
            echo "Summary: ${NODES} nodes, ${EDGES} edges"
            echo
            echo "Note: ${HL_MSG}"
            echo
            echo "<details><summary>SVG Preview</summary>"
            echo
            echo "<img src=\"${RAW_BASE}/overview-dag.svg\" alt=\"Overview DAG\"/>"
            echo
            echo "</details>"
            echo
            if test -f docs/plan-dag.svg; then
              printf '\n### T.A.S.K.S. DAG\n'
              echo
              echo "<details open><summary>Plan DAG</summary>"
              echo "<img src=\"${RAW_BASE}/plan-dag.svg\" alt=\"Plan DAG\"/>"
              echo "</details>"
            fi
            if test -f docs/runtime.svg; then
              echo "<details><summary>Runtime (Coordinator) Graph</summary>"
              echo "<img src=\"${RAW_BASE}/runtime.svg\" alt=\"Runtime DAG\"/>"
              echo "</details>"
            fi
          } > "$TMPFILE"
      - name: Upload DAG artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: overview-dag
          path: |
            docs/overview-dag.dot
            docs/overview-dag.svg
            docs/plan-dag.svg
            docs/runtime.svg
      - name: Comment DAG on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          hide_and_recreate: true
          header: Overview DAG
          path: ${{ runner.temp }}/dag-comment.md
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true
