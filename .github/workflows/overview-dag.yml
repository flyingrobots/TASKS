name: Overview DAG

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-overview-dag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz jq
      - name: Preflight checks
        run: |
          set -e
          test -f scripts/gh/overview-dag.sh || { echo "missing scripts/gh/overview-dag.sh" >&2; exit 1; }
          command -v dot >/dev/null 2>&1 || { echo "graphviz 'dot' not installed" >&2; exit 1; }
      - name: Generate overview DAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          bash scripts/gh/overview-dag.sh docs/overview-dag.dot docs/overview-dag.svg
      - name: Stage DAG for commit
        if: github.event_name == 'pull_request'
        run: |
          cp -f docs/overview-dag.svg "$RUNNER_TEMP/overview-dag.svg"
          cp -f docs/overview-dag.dot "$RUNNER_TEMP/overview-dag.dot"
      - name: Verify DAG outputs
        run: |
          test -f docs/overview-dag.dot || { echo "docs/overview-dag.dot missing" >&2; exit 1; }
          test -f docs/overview-dag.svg || { echo "docs/overview-dag.svg missing" >&2; exit 1; }
      - name: Summarize DAG artifacts
        run: |
          set -e
          echo "Graphviz:" $(dot -V 2>&1 | head -n1)
          echo "Sizes:"; ls -lh docs/overview-dag.*
          # Quick node/edge counts (best-effort)
          NODES=$(grep -Eo '^\s*[A-Za-z0-9_]+\s*\[' docs/overview-dag.dot | wc -l | tr -d ' ')
          EDGES=$(grep -Eo '->' docs/overview-dag.dot | wc -l | tr -d ' ')
          echo "Nodes: ${NODES}  Edges: ${EDGES}"
      - name: Commit DAG image to PR branch (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: commit_dag
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -e
          git fetch origin "refs/heads/${BRANCH}:refs/heads/${BRANCH}" --depth=1
          if ! git checkout "$BRANCH" 2>/dev/null; then
            echo "checkout failed; creating $BRANCH" >&2
            git checkout -B "$BRANCH"
          fi
          mkdir -p docs
          # restore generated files from previous step
          cp -f "$RUNNER_TEMP/overview-dag.svg" docs/overview-dag.svg || true
          cp -f "$RUNNER_TEMP/overview-dag.dot" docs/overview-dag.dot || true
          git add docs/overview-dag.svg docs/overview-dag.dot
          if ! git diff --cached --quiet; then
            git commit -m "docs: update overview DAG (CI)"
            git push origin "$BRANCH"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare PR comment content
        if: github.event_name == 'pull_request' && steps.commit_dag.outputs.pushed == 'true'
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TMPFILE: ${{ runner.temp }}/dag-comment.md
          RAW_OK: ${{ steps.commit_dag.outputs.pushed }}
        run: |
          RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/docs/overview-dag.svg"
          NODES=$(grep -Eo '^\s*[A-Za-z0-9_]+\s*\[' docs/overview-dag.dot | wc -l | tr -d ' ')
          EDGES=$(grep -Eo '->' docs/overview-dag.dot | wc -l | tr -d ' ')
          {
            echo "### Overview DAG"
            echo
            echo "Workflow run: ${RUN_URL}"
            echo
            echo "Summary: ${NODES} nodes, ${EDGES} edges"
            echo
            if [ "${RAW_OK}" = "true" ]; then
              echo "<details><summary>SVG Preview</summary>"
              echo
              echo "<img src=\"${RAW_URL}\" alt=\"Overview DAG\"/>"
              echo
              echo "</details>"
              echo
              echo "Raw SVG: ${RAW_URL}"
            else
              echo "(Image not embedded for this run — no branch commit). Download the artifact from the workflow run."
            fi
          } > "$TMPFILE"
      - name: Upload DAG artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: overview-dag
          path: |
            docs/overview-dag.dot
            docs/overview-dag.svg
      - name: Comment DAG on PR
        if: github.event_name == 'pull_request' && steps.commit_dag.outputs.pushed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          hide_and_recreate: true
          header: Overview DAG
          path: ${{ runner.temp }}/dag-comment.md
